<!DOCTYPE html>

<style>
/* ===== Global ===== */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI',Tahoma,sans-serif;
  background:#f2f2f2;
  direction:rtl;
}

/* ===== Header ===== */
header{
  background:linear-gradient(90deg,#00897B,#004D40);
  color:#fff;
  padding:20px 30px;
  font-size:22px;
  box-shadow:0 6px 20px rgba(0,0,0,.15);
}

/* ===== Edit Notice ===== */
#editNotice{
  background:#FFF3CD;
  color:#856404;
  padding:12px;
  text-align:center;
  font-weight:bold;
  border-bottom:2px solid #FFEEBA;
}

/* ===== Search ===== */
.search{
  background:#E0F2F1;
  padding:15px;
  text-align:center;
  position:relative;
}
.search input{
  width:360px;
  padding:10px;
  font-size:15px;
  border:none;
  border-bottom:2px solid #aaa;
  background:transparent;
}
.search input:focus{
  outline:none;
  border-bottom-color:#00897B;
}
.search button{
  margin-right:8px;
  padding:10px 24px;
  border:none;
  border-radius:24px;
  background:linear-gradient(90deg,#00897B,#004D40);
  color:#fff;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.search button:hover{opacity:.9}

/* ===== Autocomplete ===== */
#suggestions{
  position:absolute;
  right:50%;
  transform:translateX(50%);
  top:55px;
  width:360px;
  background:#fff;
  border-radius:16px;
  box-shadow:0 8px 18px rgba(0,0,0,.2);
  display:none;
  z-index:1000;
}
.suggest-item{
  padding:12px;
  cursor:pointer;
  border-bottom:1px solid #eee;
}
.suggest-item:last-child{border-bottom:none}
.suggest-item:hover{background:#E0F2F1}
.match{
  background:#FFE082;
  padding:0 4px;
  border-radius:4px;
  font-weight:bold;
}

/* ===== Tabs ===== */
.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:12px;
  background:#fff;
}
.tabs button{
  border:none;
  padding:10px 20px;
  border-radius:24px;
  background:#E0F2F1;
  cursor:pointer;
  font-weight:600;
  transition:.3s;
}
.tabs button.active{
  background:linear-gradient(90deg,#00897B,#004D40);
  color:#fff;
}

/* ===== Sections ===== */
.section{
  display:none;
  padding:20px;
}
.section.active{display:block}

/* ===== Form Grid ===== */
.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

/* ===== Field Card ===== */
.field{
  background:#fff;
  padding:14px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.1);
}
.field label{
  font-size:14px;
  font-weight:600;
  color:#555;
}
.field input{
  width:100%;
  margin-top:6px;
  padding:10px 6px;
  font-size:15px;
  border:none;
  border-bottom:2px solid #ccc;
  background:transparent;
}
.field input:focus{
  outline:none;
  border-bottom-color:#00897B;
}

/* ===== Actions ===== */
.actions{

  padding:20px;

.actions button{
  margin:6px;
  padding:12px 28px;

  color:#fff;

}
.actions button:hover{opacity:.9}
.actions button:disabled{opacity:.6;cursor:not-allowed}

  "البيانات الأساسية": ALL_COLUMNS.slice(0,18),
  "القبول والدراسة": ALL_COLUMNS.slice(18,48),
  "الشهادات": ALL_COLUMNS.slice(48,78),

  "الإشراف والبحث": ALL_COLUMNS.slice(120,155),
  "التمديدات والتأجيل": ALL_COLUMNS.slice(155,190),
  "المناقشة": ALL_COLUMNS.slice(190,235),
  "التخرج والتواقيع": ALL_COLUMNS.slice(235)
};

(function buildUI(){
  const tabs=document.getElementById("tabs");
  const secs=document.getElementById("sections");
  let first=true;
  for(const t in TABS){
    const b=document.createElement("button");
    b.textContent=t;
    if(first) b.classList.add("active");
    b.onclick=()=>openTab(t,b);
    tabs.appendChild(b);

    const sec=document.createElement("div");
    sec.id=t;
    sec.className="section"+(first?" active":"");

    const grid=document.createElement("div");
    grid.className="form-grid";

    TABS[t].forEach(c=>{
      grid.innerHTML+=`<div class="field"><label>${c}</label><input id="${c}" ${c==="رقم الطالب"?"readonly":""}></div>`;
    });

    sec.appendChild(grid);
    secs.appendChild(sec);
    first=false;
  }
})();

function openTab(id,btn){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

function post(action,payload){
  const f=new FormData();
  f.append("action",action);
  f.append("payload",JSON.stringify(payload));
  return fetch(API_URL,{method:"POST",body:f}).then(r=>r.json());
}

fetch(API_URL).then(r=>r.json()).then(d=>{
  document.getElementById("رقم الطالب").value=d.nextId;
});

function addStudent(){
  if(MODE!=="ADD") return;
  const row=ALL_COLUMNS.map(c=>document.getElementById(c).value||"");
  post("add",{row}).then(()=>alert("✅ تمت إضافة الطالب بنجاح"));
}

function searchStudent(){
  const q=document.getElementById("searchBox").value.trim();
  if(!q) return;
  post("search",{query:q}).then(d=>{
    if(!d.found) return alert("❌ الطالب غير موجود");
    if(confirm("الطالب موجود، هل تريد تعديل بياناته؟")){
      MODE="EDIT";
      currentRowIndex=d.rowIndex;
      ALL_COLUMNS.forEach((c,i)=>{
        document.getElementById(c).value=d.row[i]||"";
      });
      document.getElementById("updateBtn").style.display="inline-block";
      document.getElementById("cancelBtn").style.display="inline-block";
      document.getElementById("addBtn").style.display="none";
      document.getElementById("editNotice").style.display="block";

    }
  });
}

function saveUpdate(){
  if(MODE!=="EDIT") return;

  const btn = document.getElementById("updateBtn");
  const originalText = btn.innerHTML;

  btn.disabled = true;
  btn.innerHTML = "⏳ جارِ الحفظ...";

  const row = ALL_COLUMNS.map(c=>document.getElementById(c).value||"");

  post("update",{rowIndex:currentRowIndex,row})
  .then(()=>{

    // 🔥 بعد الحفظ أعد جلب الطالب من الشيت للتأكيد
    const studentId = document.getElementById("رقم الطالب").value;

    return post("search",{query:studentId});
  })
  .then(d=>{

    if(d && d.found){
      ALL_COLUMNS.forEach((c,i)=>{
        document.getElementById(c).value = d.row[i] || "";
      });
    }

    btn.innerHTML = "✅ تم الحفظ بنجاح";

    setTimeout(()=>{
      btn.innerHTML = originalText;
      btn.disabled = false;
    },1500);

  })
  .catch(()=>{
    btn.innerHTML="❌ خطأ بالحفظ";
    btn.disabled=false;
  });
}



/* ===== الإضافة فقط ===== */
function highlightMatch(text, query){
  if(!query) return text;
  const q=query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return text.replace(new RegExp(q,"gi"),m=>`<span class="match">${m}</span>`);
}

function suggestNames(){
  const q=document.getElementById("searchBox").value.trim();
  const box=document.getElementById("suggestions");
  if(q.length<2){box.style.display="none";return;}
  post("suggest",{query:q}).then(d=>{
    box.innerHTML="";
    if(!d.suggestions||!d.suggestions.length){box.style.display="none";return;}
    d.suggestions.forEach(name=>{
      const div=document.createElement("div");
      div.className="suggest-item";
      div.innerHTML=highlightMatch(name,q);
      div.onclick=()=>{document.getElementById("searchBox").value=name;box.style.display="none";};
      box.appendChild(div);
    });
    box.style.display="block";
  });
}

document.addEventListener("click",e=>{
  if(!e.target.closest(".search")) document.getElementById("suggestions").style.display="none";
});
</script>
