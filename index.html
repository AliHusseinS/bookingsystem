<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منظومة طلبة الدراسات العليا</title>

<style>
body{font-family:Tahoma;background:#F5F7F8;margin:0}
header{background:#00897B;color:#fff;padding:15px;font-size:20px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:#fff}
.tabs button{border:none;background:#E0F2F1;padding:8px 14px;border-radius:20px;cursor:pointer}
.tabs button.active{background:#00897B;color:#fff}
.section{display:none;padding:20px}
.section.active{display:block}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.field{background:#fff;padding:10px;border-radius:8px}
.field label{font-size:13px;font-weight:bold}
.field input{width:100%;padding:7px;margin-top:4px}
.actions{text-align:center;padding:15px}
.actions button{padding:10px 20px;margin:5px}
</style>
</head>

<body>

<header>منظومة إدخال وتعديل بيانات الطلبة</header>

<div style="padding:10px;text-align:center;background:#E0F2F1">
<input id="searchBox" placeholder="رقم الطالب أو الاسم الرباعي" style="width:300px;padding:7px">
<button onclick="searchStudent()">بحث</button>
</div>

<div class="tabs" id="tabs"></div>
<div id="sections"></div>

<div class="actions">
<button onclick="addStudent()">إضافة طالب</button>
<button id="updateBtn" onclick="saveUpdate()" style="display:none">حفظ التعديلات</button>
<button id="cancelBtn" onclick="location.reload()" style="display:none">إلغاء</button>
</div>

<script>
// ===== ضع رابط Google Script هنا =====
const API_URL = "https://script.google.com/macros/s/AKfycbwZOZO5c1JpjcqdvRs4JmciDp2Ofg5WhNoCJnHphprXLTHl3cYT_38R2MVTme5njkeT/exec";

let MODE = "ADD";
let currentRowIndex = null;

/* ===== الأعمدة (يدوياً – كما طلبت) ===== */
const ALL_COLUMNS = [
"رقم الطالب","المف الورقي","الاسم الرباعي واللقب","الجنس","تاريخ الميلاد",
"سنة القبول","قناة القبول","الجامعة المقبول فيها","الكلية المقبول فيها","القسم المقبول فيه",
"رقم الامر الجامعي بالقبول","تاريخ الامر الجامعي بالقبول","نوع القبول","نوع الدراسة",
"رقم الموبايل","البريد الالكتروني",
"رقم وثيقة البكالوريوس","تاريخ وثيقة البكالوريوس","معدل البكلوريوس",
"عنوان الرسالة باللغة العربية","عنوان الرسالة باللغة الإنكليزية",
"اسم المشرف الأول","اللقب العلمي للمشرف1",
"تاريخ المناقشة","درجة المناقشة","معدل الطالب النهائي",
"رقم الامر الجامعي بالتخرج","تاريخ الامر الجامعي بالتخرج",
"منظم الاستمارة","عميد الكلية"
];

/* ===== Tabs ===== */
const TABS = {
"بيانات أساسية": ALL_COLUMNS.slice(0,6),
"القبول": ALL_COLUMNS.slice(6,14),
"الاتصال": ALL_COLUMNS.slice(14,16),
"الشهادات": ALL_COLUMNS.slice(16,19),
"الإشراف": ALL_COLUMNS.slice(19,23),
"المناقشة": ALL_COLUMNS.slice(23,26),
"التخرج": ALL_COLUMNS.slice(26)
};

function buildUI(){
const tabsDiv=document.getElementById("tabs");
const secDiv=document.getElementById("sections");
let first=true;

for(const t in TABS){
const btn=document.createElement("button");
btn.textContent=t;
if(first)btn.classList.add("active");
btn.onclick=()=>openTab(t,btn);
tabsDiv.appendChild(btn);

const sec=document.createElement("div");
sec.id=t;
sec.className="section"+(first?" active":"");

const grid=document.createElement("div");
grid.className="form-grid";

TABS[t].forEach(c=>{
grid.innerHTML+=`
<div class="field">
<label>${c}</label>
<input id="${c}" ${c==="رقم الطالب"?"readonly":""}>
</div>`;
});

sec.appendChild(grid);
secDiv.appendChild(sec);
first=false;
}
}
buildUI();

/* ===== Tabs ===== */
function openTab(id,btn){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
}

/* ===== جلب رقم الطالب ===== */
fetch(API_URL).then(r=>r.json()).then(d=>{
document.getElementById("رقم الطالب").value=d.nextId;
});

/* ===== إضافة ===== */
function addStudent(){
if(MODE!=="ADD")return;
const row=ALL_COLUMNS.map(c=>document.getElementById(c).value||"");
fetch(API_URL,{method:"POST",headers:{'Content-Type':'application/json'},
body:JSON.stringify({action:"add",row})})
.then(()=>alert("تمت الإضافة"));
}

/* ===== بحث ===== */
function searchStudent(){
const q=document.getElementById("searchBox").value.trim();
if(!q)return;
fetch(API_URL,{method:"POST",headers:{'Content-Type':'application/json'},
body:JSON.stringify({action:"search",query:q})})
.then(r=>r.json()).then(d=>{
if(!d.found)return alert("غير موجود");
if(confirm("الطالب موجود، هل تريد التعديل؟")){
MODE="EDIT";
currentRowIndex=d.rowIndex;
ALL_COLUMNS.forEach((c,i)=>document.getElementById(c).value=d.row[i]||"");
document.getElementById("updateBtn").style.display="inline-block";
document.getElementById("cancelBtn").style.display="inline-block";
}
});
}

/* ===== تحديث ===== */
function saveUpdate(){
if(MODE!=="EDIT")return;
const row=ALL_COLUMNS.map(c=>document.getElementById(c).value||"");
fetch(API_URL,{method:"POST",headers:{'Content-Type':'application/json'},
body:JSON.stringify({action:"update",rowIndex:currentRowIndex,row})})
.then(()=>alert("تم حفظ التعديلات"));
}
</script>

</body>
</html>
