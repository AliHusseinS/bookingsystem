<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منظومة طلبة الدراسات العليا</title>

<style>
body{margin:0;font-family:Tahoma;background:#F5F7F8}
header{background:#00897B;color:#fff;padding:15px;font-size:20px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:#fff}
.tabs button{border:none;background:#E0F2F1;padding:8px 14px;border-radius:20px;cursor:pointer}
.tabs button.active{background:#00897B;color:#fff}
.section{display:none;padding:20px}
.section.active{display:block}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.field{background:#fff;padding:10px;border-radius:8px}
.field label{font-size:13px;font-weight:bold;color:#004D40}
.field input{width:100%;padding:7px;margin-top:4px}
.actions{text-align:center;padding:15px}

/* ===== Search ===== */
.search{
  padding:10px;
  text-align:center;
  background:#E0F2F1;
  position:relative;
}

.search input{
  width:360px;
  padding:7px;
}

.search button{
  padding:7px 16px;
}

/* ===== Autocomplete ===== */
#suggestions{
  position:absolute;
  right:50%;
  transform:translateX(50%);
  top:45px;
  width:360px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 8px 18px rgba(0,0,0,.2);
  display:none;
  z-index:1000;
  text-align:right;
}

.suggest-item{
  padding:10px;
  cursor:pointer;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.suggest-item:last-child{
  border-bottom:none;
}

.suggest-item:hover{
  background:#E0F2F1;
}

/* ===== Highlight ===== */
.match{
  background:#FFE082;
  padding:0 2px;
  border-radius:4px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>منظومة إدخال وتعديل بيانات الطلبة – كلية التخطيط العمراني</header>

<!-- ===== Search Box (معدل فقط) ===== -->
<div class="search">
  <input id="searchBox"
         placeholder="رقم الطالب أو الاسم الرباعي"
         oninput="suggestNames()">
  <button onclick="searchStudent()">بحث</button>

  <!-- قائمة الاقتراحات -->
  <div id="suggestions"></div>
</div>

<div class="tabs" id="tabs"></div>
<div id="sections"></div>

<div class="actions">
  <button onclick="addStudent()">إضافة طالب جديد</button>
  <button id="updateBtn" onclick="saveUpdate()" style="display:none">حفظ التعديلات</button>
  <button id="cancelBtn" onclick="location.reload()" style="display:none">إلغاء</button>
</div>

<script>
/* ================== API ================== */
const API_URL = "https://script.google.com/macros/s/AKfycbyD2QnmcOA2opf7X2Q-lQap6G_Av0aJwjQceJ_QLW4o9ZumZvU1AaoKpG4H-XxmwIGl/exec";

/* ================== حالة ================== */
let MODE = "ADD";
let currentRowIndex = null;

/* ================== الأعمدة (كما هي) ================== */
const ALL_COLUMNS = [ /* نفس قائمتك بدون تغيير */ 
"رقم الطالب","المف الورقي","الاسم الرباعي واللقب"
];

/* ================== Tabs ================== */
const TABS = {
  "البيانات الأساسية": ALL_COLUMNS
};

/* ================== بناء الواجهة ================== */
(function buildUI(){
  const tabs=document.getElementById("tabs");
  const secs=document.getElementById("sections");
  let first=true;

  for(const t in TABS){
    const b=document.createElement("button");
    b.textContent=t;
    if(first) b.classList.add("active");
    b.onclick=()=>openTab(t,b);
    tabs.appendChild(b);

    const sec=document.createElement("div");
    sec.id=t;
    sec.className="section"+(first?" active":"");

    const grid=document.createElement("div");
    grid.className="form-grid";

    TABS[t].forEach(c=>{
      grid.innerHTML+=`
        <div class="field">
          <label>${c}</label>
          <input id="${c}" ${c==="رقم الطالب"?"readonly":""}>
        </div>`;
    });

    sec.appendChild(grid);
    secs.appendChild(sec);
    first=false;
  }
})();

function openTab(id,btn){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

/* ================== POST ================== */
function post(action,payload){
  const f=new FormData();
  f.append("action",action);
  f.append("payload",JSON.stringify(payload));
  return fetch(API_URL,{method:"POST",body:f}).then(r=>r.json());
}

/* ================== Highlight ================== */
function highlightMatch(text, query){
  if(!query) return text;
  const q = query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return text.replace(new RegExp(q,"gi"),
    m=>`<span class="match">${m}</span>`);
}

/* ================== Autocomplete ================== */
function suggestNames(){
  const q=document.getElementById("searchBox").value.trim();
  const box=document.getElementById("suggestions");

  if(q.length<2){
    box.style.display="none";
    return;
  }

  post("suggest",{query:q}).then(d=>{
    box.innerHTML="";
    if(!d.suggestions || !d.suggestions.length){
      box.style.display="none";
      return;
    }

    d.suggestions.forEach(name=>{
      const div=document.createElement("div");
      div.className="suggest-item";
      div.innerHTML=highlightMatch(name,q);
      div.onclick=()=>{
        document.getElementById("searchBox").value=name;
        box.style.display="none";
      };
      box.appendChild(div);
    });

    box.style.display="block";
  });
}

/* ================== باقي الكود (كما هو) ================== */
function addStudent(){/* unchanged */}
function searchStudent(){/* unchanged */}
function saveUpdate(){/* unchanged */}
</script>

</body>
</html>
