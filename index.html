<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام إدخال معلومات الطلبة</title>

<style>

body{
margin:0;
font-family:Tahoma;
background:#F5F7F8;
}

header{
background:#00897B;
color:white;
padding:16px 30px;
font-size:20px;
font-weight:bold;
display:flex;
justify-content:space-between;
align-items:center;
border-radius:0 0 12px 12px;
}

.container{
padding:25px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:14px;
}

.field{
background:white;
padding:10px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.05);
}

.field label{
font-size:13px;
font-weight:bold;
color:#004D40;
}

.field input{
width:100%;
padding:8px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

.save-area{
margin-top:25px;
text-align:center;
}

.save-btn{
background:linear-gradient(to right,#00796B,#004D40);
color:white;
border:none;
padding:14px 45px;
border-radius:30px;
font-size:17px;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.save-btn:hover{
opacity:0.9;
}

.footer{
margin-top:25px;
background:#E0F2F1;
padding:12px;
text-align:center;
font-weight:bold;
color:#004D40;
border-radius:12px;
}

</style>
</head>

<body>

<header>
<div>نظام إدخال معلومات الطلبة</div>
<div>كلية التخطيط العمراني</div>
</header>

<div class="container">

<h3 style="color:#004D40">إضافة معلومات الطالب</h3>

<div id="formArea" class="form-grid"></div>

<div class="save-area">
<button class="save-btn" onclick="saveData()">إضافة معلومات الطالب</button>
</div>

</div>

<div class="footer">
يتم الحفظ مباشرة في Google Sheet (information)
</div>

<script>

// ================= CONFIG =================

const API_URL = "https://script.google.com/macros/s/AKfycbydX4To_0ZDA3_ZExCmZQd8gS-cLe_rBLmyeZ5T7TgF28CVWSzo5NxpKmcGchYajyHy/exec";

let headers = [];
let studentIdIndex = -1;

// ================= LOAD HEADERS =================

fetch(API_URL)
.then(res => res.json())
.then(data => {

headers = data.headers;

const nextId = data.nextId;

studentIdIndex = headers.indexOf("رقم الطالب");

buildForm(headers, nextId);

})
.catch(err=>{
alert("خطأ في الاتصال مع Google Script");
console.log(err);
});

// ================= BUILD FORM =================

function buildForm(cols, nextId){

const form = document.getElementById("formArea");

form.innerHTML = "";

cols.forEach((col,index)=>{

const div = document.createElement("div");
div.className="field";

let inputHTML = `<input id="f${index}" placeholder="${col}">`;

if(col === "رقم الطالب"){
inputHTML = `
<input id="f${index}" 
value="${nextId}" 
readonly 
style="background:#E0F2F1;font-weight:bold;color:#004D40">
`;
}

div.innerHTML = `
<label>${col}</label>
${inputHTML}
`;

form.appendChild(div);

});

}

// ================= SAVE =================

function saveData(){

let row=[];

headers.forEach((h,i)=>{
row.push(document.getElementById("f"+i).value);
});

fetch(API_URL,{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({ row: row })
})

.then(res=>res.json())
.then(d=>{
alert("✅ تم حفظ معلومات الطالب بنجاح");
location.reload();
});

}

</script>

</body>
</html>
