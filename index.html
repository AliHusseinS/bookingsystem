<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منظومة الطلبة</title>

<style>
:root{
  --primary:#00897B;
  --accent:#E0F2F1;
  --border:#CFD8DC;
}
body{margin:0;font-family:Tahoma;background:#F5F7F8}
header{background:var(--primary);color:#fff;padding:18px;font-size:22px}

.search{
  background:#fff;
  margin:20px;
  padding:16px;
  border-radius:14px;
  position:relative;
}
.search input{
  width:340px;
  padding:10px;
  border:none;
  border-bottom:2px solid var(--border);
  outline:none;
}
.search input:focus{border-bottom-color:var(--primary)}
.search button{
  background:var(--primary);
  color:#fff;
  border:none;
  padding:10px 22px;
  border-radius:30px;
  cursor:pointer;
}

#suggestions{
  position:absolute;
  top:58px;
  right:0;
  width:340px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 8px 18px rgba(0,0,0,.15);
  display:none;
  z-index:999;
}
#suggestions div{
  padding:10px;
  cursor:pointer;
}
#suggestions div:hover{
  background:var(--accent);
}
</style>
</head>

<body>

<header>منظومة إدخال وتعديل بيانات الطلبة</header>

<div class="search">
  <input id="searchBox"
         placeholder="اكتب اسم الطالب..."
         oninput="suggestNames()">
  <button onclick="searchStudent()">بحث</button>
  <div id="suggestions"></div>
</div>

<script>
const API_URL = "PUT_YOUR_SCRIPT_URL";

/* POST */
function post(action,payload){
  const f=new FormData();
  f.append("action",action);
  f.append("payload",JSON.stringify(payload));
  return fetch(API_URL,{method:"POST",body:f}).then(r=>r.json());
}

/* Autocomplete ذكي */
function suggestNames(){
  const q=document.getElementById("searchBox").value.trim();
  const box=document.getElementById("suggestions");

  if(q.length<2){
    box.style.display="none";
    return;
  }

  post("suggest",{query:q}).then(d=>{
    box.innerHTML="";
    if(!d.suggestions.length){
      box.style.display="none";
      return;
    }

    d.suggestions.forEach(name=>{
      const div=document.createElement("div");
      div.textContent=name;
      div.onclick=()=>{
        document.getElementById("searchBox").value=name;
        box.style.display="none";
      };
      box.appendChild(div);
    });
    box.style.display="block";
  });
}

/* البحث الأصلي */
function searchStudent(){
  const q=document.getElementById("searchBox").value.trim();
  if(!q) return;
  post("search",{query:q}).then(d=>{
    if(!d.found) alert("❌ الطالب غير موجود");
    else alert("✔ تم العثور على الطالب");
  });
}
</script>

</body>
</html>
